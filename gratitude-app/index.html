<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gladmoment</title>
  <meta name="description" content="A gentle, private gratitude reminder and journal. Pause, reflect, express, save — and continue your day.">
  <meta name="theme-color" content="#5b34c4">
  <!-- Link previews (Facebook, WhatsApp, TikTok, X, LinkedIn) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Gemrhythm">
  <meta property="og:title" content="Gladmoment: a free gratitude app from Gemrhythm">
  <meta property="og:description" content="Pause, notice and give thanks. Gentle reminders, a private journal and calm 1-minute pauses, in English and French.">
  <meta property="og:url" content="https://gemrhythm.com/gladmoment/">
  <meta property="og:image" content="https://gemrhythm.com/gladmoment/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Gladmoment: Pause. Notice. Give thanks. Faites une pause. Remarquez. Dites merci.">
  <meta property="og:locale" content="en_GB">
  <meta property="og:locale:alternate" content="fr_FR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Gladmoment: a free gratitude app from Gemrhythm">
  <meta name="twitter:description" content="Pause, notice and give thanks. Gentle reminders, a private journal and calm 1-minute pauses.">
  <meta name="twitter:image" content="https://gemrhythm.com/gladmoment/icons/og-image.png">
  <link rel="canonical" href="https://gemrhythm.com/gladmoment/">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gladmoment">
  <link rel="stylesheet" href="./css/styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var s = JSON.parse(localStorage.getItem('gratitude-moments:v1') || 'null');
      var p = (s && s.user && s.user.preferences) || {};
      var dark = p.theme === 'dark' || ((!p.theme || p.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.textSize = p.textSize || 'normal';
      var navFr = String((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase().indexOf('fr') === 0;
      if (p.language === 'fr' || ((!p.language || p.language === 'auto') && navFr)) document.documentElement.lang = 'fr';
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <p id="storage-warning" class="storage-warning" role="alert" hidden></p>
  <div class="layout">
    <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
    <main id="main" tabindex="-1">
      <noscript><p class="page">Gladmoment needs JavaScript to run.</p></noscript>
    </main>
  </div>
  <div id="reminder-banner" class="reminder-banner" hidden></div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <div id="sr-announcer" class="sr-only" aria-live="polite"></div>
  <dialog id="dialog" class="dialog"></dialog>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
